server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API ke backend Django — isi env API_PROXY_TARGET saat run,
    # contoh: -e API_PROXY_TARGET=http://host.docker.internal:8090
    location /api/ {
        proxy_pass ${API_PROXY_TARGET};
        proxy_set_header Host $${host};
        proxy_set_header X-Real-IP $${remote_addr};
        proxy_set_header X-Forwarded-For $${proxy_add_x_forwarded_for};
        proxy_set_header X-Forwarded-Proto $${scheme};
    }

    # SPA fallback: semua rute non-file dialihkan ke index.html
    location / {
        try_files $${uri} $${uri}/ /index.html;
    }
}
