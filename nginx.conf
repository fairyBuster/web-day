server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API ke backend — isi env API_PROXY_TARGET saat run,
    # contoh: -e API_PROXY_TARGET=http://host.docker.internal:8090
    location /api/ {
        proxy_pass ${API_PROXY_TARGET};
        proxy_set_header Host ${proxy_host};
        proxy_set_header X-Real-IP ${remote_addr};
        proxy_set_header X-Forwarded-For ${proxy_add_x_forwarded_for};
        proxy_set_header X-Forwarded-Proto ${scheme};
        # SNI eksplisit + TLS modern — wajib untuk backend di belakang Cloudflare
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Gambar/asset dari backend (pola sama seperti ampli: media & static
    # di-reverse_proxy). Tanpa ini, SPA fallback menangkap request gambar
    # dan mengembalikan index.html (200 text/html) — gambar tidak muncul.
    location /media/ {
        proxy_pass ${API_PROXY_TARGET};
        proxy_set_header Host ${proxy_host};
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    location /static/ {
        proxy_pass ${API_PROXY_TARGET};
        proxy_set_header Host ${proxy_host};
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # SPA fallback: semua rute non-file dialihkan ke index.html
    location / {
        try_files ${uri} ${uri}/ /index.html;
    }
}
